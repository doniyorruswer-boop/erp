name: SonarQube Quality Analysis & Quality Gate

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  sonar-quality-analysis:
    name: SonarQube Code Quality & Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: eduhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Full clone is strictly required for accurate blame and changed-code detection
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend Build & Coverage Generation
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client & Push Schema
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/eduhub_test?schema=public"
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Verify Backend TypeScript Types
        working-directory: backend
        run: npm run typecheck

      - name: Run Backend Tests with LCOV Coverage
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/eduhub_test?schema=public"
          JWT_SECRET: "ci-testing-jwt-secret-minimum-32-chars-long-secure"
          REDIS_URL: "redis://localhost:6379"
        run: npm run test:cov

      # Frontend Lint Report Generation
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate ESLint Report for SonarQube
        working-directory: frontend
        run: npm run lint:report

      # SonarQube Scanner Action
      - name: SonarQube Code Quality Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # SonarQube Quality Gate Check
      - name: SonarQube Quality Gate Verification
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
