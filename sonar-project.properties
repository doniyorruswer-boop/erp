# ==============================================================================
# EduHub ERP — SonarQube Quality Analysis Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Project Identification & Metadata
# ------------------------------------------------------------------------------
sonar.projectKey=eduhub-erp
sonar.projectName=EduHub ERP (Enterprise Education Management System)
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# ------------------------------------------------------------------------------
# 2. Source Code & Test File Paths
# ------------------------------------------------------------------------------
# Source directories for backend (NestJS) and frontend (Vue 3 + TypeScript)
sonar.sources=backend/src,frontend/src

# Test directories
sonar.tests=backend/test,backend/src,frontend/e2e

# Test file inclusion patterns
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,backend/test/**/*.ts,frontend/e2e/**/*.js,frontend/e2e/**/*.ts

# Global Exclusions (Build outputs, dependencies, reports, docs, migrations)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.storybook/**,\
  **/storybook-static/**,\
  **/coverage/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  scripts/**,\
  docs/**,\
  backend/prisma/migrations/**,\
  backend/prisma/seed.ts,\
  **/*.d.ts

# ------------------------------------------------------------------------------
# 3. Duplicated Code Detection (CPD - Copy/Paste Detector)
# ------------------------------------------------------------------------------
# Files excluded from duplication checks (tests, mock fixtures, stories)
sonar.cpd.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  backend/test/**,\
  frontend/e2e/**,\
  frontend/src/stories/**,\
  frontend/src/api/*Data.js

# Duplication thresholds (Strict enterprise standards)
sonar.cpd.javascript.minimumtokens=50
sonar.cpd.typescript.minimumtokens=50
sonar.cpd.javascript.minimumLines=10
sonar.cpd.typescript.minimumLines=10

# ------------------------------------------------------------------------------
# 4. TypeScript & Vue 3 Parser Configuration
# ------------------------------------------------------------------------------
# Tsconfig paths for accurate AST & type-aware analysis
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.json

# Recognized web/Node environments
sonar.javascript.environments=browser,node,jest

# Vue SFC File handling
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx,.vue

# ESLint report ingestion
sonar.eslint.reportPaths=frontend/reports/eslint-report.json

# ------------------------------------------------------------------------------
# 5. Code Coverage & Execution Reports
# ------------------------------------------------------------------------------
# LCOV coverage report paths generated by Jest / Playwright
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Files excluded from coverage calculation (DTOs, stories, types, migrations)
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.dto.ts,\
  **/*.entity.ts,\
  **/*.interface.ts,\
  **/types/**,\
  **/stories/**,\
  **/e2e/**,\
  backend/prisma/**,\
  frontend/src/stories/**,\
  frontend/src/config/**

# ------------------------------------------------------------------------------
# 6. Quality Gate Rules: Bugs, Vulnerabilities & Code Smells
# ------------------------------------------------------------------------------
# Security & Vulnerability Analysis
sonar.security.scan.enabled=true

# Cognitive & Cyclomatic Complexity thresholds
# Consistent with AGENTS.md:
# Max component size: 250 lines
# Max function size: 40 lines
# Max Cognitive Complexity per function: 15
sonar.typescript.cognitiveComplexity.threshold=15
sonar.javascript.cognitiveComplexity.threshold=15

# Strict issue severity mappings
sonar.qualitygate.wait=true
